name: KumbhConnect Android Debug Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Build KumbhConnect Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify project files
        run: |
          echo "Checking required project files..."
          test -f package.json
          test -f capacitor.config.ts
          test -f scripts/android/prepare-web.mjs
          echo "Required files found."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kumbhconnect-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
