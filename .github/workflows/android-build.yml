name: KumbhConnect Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Select Android build type"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: read

concurrency:
  group: kumbhconnect-android-build
  cancel-in-progress: false

jobs:
  android-build:
    name: Build KumbhConnect
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f capacitor.config.ts
          test -f scripts/android/prepare-web.mjs

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const deps = {
            ...p.dependencies,
            ...p.devDependencies
          };

          for (const name of [
            "@capacitor/core",
            "@capacitor/cli",
            "@capacitor/android"
          ]) {
            if (!deps[name]) {
              throw new Error(`Missing dependency: ${name}`);
            }
          }

          const config = fs.readFileSync("capacitor.config.ts", "utf8");

          if (!/appId\s*:\s*['"]in\.kumbhconnect\.nashik['"]/.test(config)) {
            throw new Error("Unexpected Capacitor appId");
          }

          console.log("Project files and app ID verified.");
          NODE

      - name: Generate package lock if missing
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi

          test -s package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify generated Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/local.properties || true

          chmod +x android/gradlew

      # -------------------------
      # DEBUG APK
      # -------------------------

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        shell: bash
        run: |
          set -euo pipefail

          cd android
          ./gradlew assembleDebug

      - name: Verify Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          unzip -tq "$APK"

          BT="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d |
            sort -V | tail -1)"

          "$BT/apksigner" verify "$APK"

      - name: Upload Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: KumbhConnect-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # -------------------------
      # RELEASE SIGNING
      # -------------------------

      - name: Validate release signing configuration
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        env:
          KS_B64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.TWA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KS_B64" || {
            echo "::error::TWA_KEYSTORE_BASE64 is missing"
            exit 1
          }

          test -n "$KS_PASSWORD" || {
            echo "::error::TWA_KEYSTORE_PASSWORD is missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "::error::TWA_KEY_ALIAS repository variable is missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "::error::TWA_KEY_PASSWORD is missing"
            exit 1
          }

      - name: Decode and validate keystore
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        env:
          KS_B64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.TWA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077

          mkdir -p "$RUNNER_TEMP/android-signing"

          KS="$RUNNER_TEMP/android-signing/release.keystore"

          printf '%s' "$KS_B64" | base64 --decode > "$KS"

          test -s "$KS" || {
            echo "::error::Decoded keystore is empty"
            exit 1
          }

          keytool -list \
            -keystore "$KS" \
            -storepass:env KS_PASSWORD \
            -alias "$KEY_ALIAS" >/dev/null

          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

          echo "Keystore validation successful."

      # -------------------------
      # SIGNED RELEASE APK + AAB
      # -------------------------

      - name: Build signed Release APK and AAB
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.TWA_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -s "$ANDROID_KEYSTORE_PATH"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          cd android

          ./gradlew assembleRelease bundleRelease \
            "-Pandroid.injected.signing.store.file=$ANDROID_KEYSTORE_PATH" \
            "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"

      - name: Verify Release APK and AAB
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        env:
          KS_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.TWA_KEY_ALIAS }}
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -s "$APK" || {
            echo "::error::Release APK missing"
            exit 1
          }

          test -s "$AAB" || {
            echo "::error::Release AAB missing"
            exit 1
          }

          unzip -tq "$APK"
          unzip -tq "$AAB"

          jarsigner -verify "$AAB" >/dev/null || {
            echo "::error::AAB signature verification failed"
            exit 1
          }

          BT="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d |
            sort -V | tail -1)"

          "$BT/apksigner" verify --verbose "$APK"

          KS_FP="$(
            keytool -list -v \
              -keystore "$ANDROID_KEYSTORE_PATH" \
              -storepass:env KS_PASSWORD \
              -alias "$KEY_ALIAS" |
            grep -m1 'SHA256:' |
            sed 's/.*SHA256: *//' |
            tr -d ':[:space:]' |
            tr 'a-f' 'A-F'
          )"

          APK_FP="$(
            "$BT/apksigner" verify --print-certs "$APK" |
            grep -m1 'certificate SHA-256 digest' |
            sed 's/.*: *//' |
            tr -d ':[:space:]' |
            tr 'a-f' 'A-F'
          )"

          test -n "$KS_FP" && test "$KS_FP" = "$APK_FP" || {
            echo "::error::APK certificate does not match the configured keystore"
            exit 1
          }

          echo "APK signature matches the configured keystore."

          sha256sum "$APK" "$AAB" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release APK and AAB
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: KumbhConnect-Release-APK-AAB
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      # -------------------------
      # CLEANUP
      # -------------------------

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/android-signing/release.keystore"
