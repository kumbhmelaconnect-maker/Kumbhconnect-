name: Build KumbhConnect Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Select Android build type"
        required: true
        type: choice
        options:
          - debug
          - release
          - both
        default: release

permissions:
  contents: read

concurrency:
  group: kumbhconnect-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APP_ID: in.kumbhconnect.nashik
      APP_NAME: KumbhConnect
      APP_VERSION: "1.3.0"
      # IMPORTANT: Set this higher than the previously accepted
      # Android app versionCode on Indus Appstore.
      APP_VERSION_CODE: "5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory was not found."
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Android SDK found."

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f capacitor.config.ts
          test -f scripts/android/prepare-web.mjs

          node -e "
            const p = require('./package.json');
            for (const d of [
              '@capacitor/core',
              '@capacitor/cli',
              '@capacitor/android'
            ]) {
              if (!(p.dependencies?.[d] || p.devDependencies?.[d])) {
                console.error('Missing dependency:', d);
                process.exitCode = 1;
              }
            }
          "

          echo "Project files verified."

      - name: Ensure npm lock file exists
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package-lock.json ] &&
             [ ! -f npm-shrinkwrap.json ] &&
             [ ! -f yarn.lock ]; then
            echo "No lock file found. Generating package-lock.json."
            npm install --package-lock-only --ignore-scripts
          fi

          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "npm lock file found."
          elif [ -f yarn.lock ]; then
            echo "::error::This workflow uses npm; yarn.lock alone is not supported."
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "::error::npm lock file is missing."
            exit 1
          fi

      - name: Prepare web assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/android/prepare-web.mjs

      - name: Verify web assets
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d www ]; then
            echo "::error::The www directory was not generated."
            exit 1
          fi

          if [ ! -f www/index.html ]; then
            echo "::error::www/index.html is missing."
            exit 1
          fi

      - name: Add Android platform
        shell: bash
        run: |
          set -euo pipefail
          npx cap add android

      - name: Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync android

      - name: Configure Android version
        shell: bash
        env:
          VERSION_NAME: ${{ env.APP_VERSION }}
          VERSION_CODE: ${{ env.APP_VERSION_CODE }}
        run: |
          set -euo pipefail

          FILE="android/app/build.gradle"
          test -f "$FILE"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          version_code = int(os.environ["VERSION_CODE"])
          version_name = os.environ["VERSION_NAME"]

          if version_code < 1:
              raise SystemExit("ERROR: VERSION_CODE must be positive.")

          match = re.search(r'\bdefaultConfig\s*\{', text)
          if not match:
              raise SystemExit(
                  "ERROR: defaultConfig block not found in build.gradle."
              )

          start = match.end()
          depth = 1
          i = start

          while i < len(text) and depth:
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
              i += 1

          if depth:
              raise SystemExit("ERROR: defaultConfig block is incomplete.")

          block = text[start:i - 1]

          block = re.sub(
              r'(?m)^\s*versionCode\s+.*$',
              '',
              block
          )
          block = re.sub(
              r'(?m)^\s*versionName\s+.*$',
              '',
              block
          )

          block = (
              f'\n        versionCode {version_code}\n'
              f'        versionName "{version_name}"\n'
              + block
          )

          text = text[:start] + block + text[i - 1:]
          path.write_text(text)

          print(f"Android versionName: {version_name}")
          print(f"Android versionCode: {version_code}")
          PY

      - name: Verify generated Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f android/gradlew
          test -f android/app/build.gradle

          chmod +x android/gradlew

          grep -nE 'versionCode|versionName|applicationId' \
            android/app/build.gradle || true

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        shell: bash
        run: |
          set -euo pipefail

          cd android
          ./gradlew --no-daemon assembleDebug

          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: KumbhConnect-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Decode release keystore
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.TWA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          KEYSTORE_PATH="$RUNNER_TEMP/kumbhconnect-release.keystore"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Release keystore validated."

      - name: Build signed Release APK and AAB
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.TWA_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -s "$ANDROID_KEYSTORE_PATH"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          cd android

          ./gradlew --no-daemon assembleRelease bundleRelease \
            "-Pandroid.injected.signing.store.file=$ANDROID_KEYSTORE_PATH" \
            "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"

          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Locate and verify APK signer
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_SDK_ROOT"

          APKSIGNER="$(find "$SDK/build-tools" \
            -type f -name apksigner -print 2>/dev/null |
            sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in Android SDK Build Tools."
            exit 1
          fi

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          "$APKSIGNER" version

      - name: Verify release artifacts and signatures
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.TWA_KEY_ALIAS }}
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -s "$APK"
          test -s "$AAB"

          echo "Checking APK ZIP integrity..."
          unzip -t "$APK" >/dev/null

          echo "Checking AAB ZIP integrity..."
          unzip -t "$AAB" >/dev/null

          echo "Verifying APK signature..."
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "Verifying AAB signature..."
          jarsigner -verify "$AAB"

          echo "Release artifacts passed signature checks."

      - name: Report artifact details
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          echo "=== APK ==="
          ls -lh "$APK"
          sha256sum "$APK"

          echo "=== AAB ==="
          ls -lh "$AAB"
          sha256sum "$AAB"

      - name: Upload Release APK and AAB
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: KumbhConnect-Release-APK-AAB
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing keystore
        if: ${{ always() && (inputs.build_type == 'release' || inputs.build_type == 'both') }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ] &&
             [ -f "$ANDROID_KEYSTORE_PATH" ]; then
            rm -f "$ANDROID_KEYSTORE_PATH"
            echo "Temporary keystore removed."
          fi
