name: KumbhConnect Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Select Android build type"
        required: true
        type: choice
        default: release
        options:
          - debug
          - release
          - both

permissions:
  contents: read

concurrency:
  group: kumbhconnect-android-build
  cancel-in-progress: false

jobs:
  build-android:
    name: Build KumbhConnect Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APP_ID: in.kumbhconnect.nashik
      APP_NAME: KumbhConnect
      APP_VERSION: "1.3.0"
      APP_VERSION_CODE: "5"

    steps:
      # 1. Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 4. Verify project files and dependencies
      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f capacitor.config.ts
          test -f scripts/android/prepare-web.mjs

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );

          const dependencies = {
            ...pkg.dependencies,
            ...pkg.devDependencies
          };

          for (const name of [
            '@capacitor/core',
            '@capacitor/cli',
            '@capacitor/android'
          ]) {
            if (!dependencies[name]) {
              throw new Error(`Missing dependency: ${name}`);
            }
          }

          console.log('Project dependencies verified.');
          NODE

      # 5. Create lockfile only if missing
      - name: Generate package lock if missing
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: npm install --package-lock-only --ignore-scripts

      # 6. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 7. Prepare web assets
      - name: Prepare web assets
        run: node scripts/android/prepare-web.mjs

      # 8. Add Android platform
      - name: Add Android platform
        run: npx cap add android

      # 9. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 10. Set Android version
      - name: Set Android app version
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("android/app/build.gradle")

          if not path.is_file():
              raise SystemExit(
                  "ERROR: android/app/build.gradle not found."
              )

          text = path.read_text()

          version_code = int(os.environ["APP_VERSION_CODE"])
          version_name = os.environ["APP_VERSION"]

          match = re.search(r'\bdefaultConfig\s*\{', text)

          if not match:
              raise SystemExit(
                  "ERROR: defaultConfig block not found."
              )

          start = match.end()
          depth = 1
          i = start

          while i < len(text) and depth:
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
              i += 1

          if depth:
              raise SystemExit(
                  "ERROR: defaultConfig block is incomplete."
              )

          block = text[start:i - 1]

          block = re.sub(
              r'(?m)^[ \t]*versionCode\s+.*(?:\n|$)',
              '',
              block
          )

          block = re.sub(
              r'(?m)^[ \t]*versionName\s+.*(?:\n|$)',
              '',
              block
          )

          version_lines = (
              f'\n        versionCode {version_code}\n'
              f'        versionName "{version_name}"\n'
          )

          block = version_lines + block

          text = text[:start] + block + text[i - 1:]
          path.write_text(text)

          print(f"Version name: {version_name}")
          print(f"Version code: {version_code}")
          PY

      # 11. Verify generated Android project
      - name: Verify generated Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/app/build.gradle

          chmod +x android/gradlew

          grep -Fq 'in.kumbhconnect.nashik' \
            android/app/build.gradle

          grep -Eq 'versionCode[[:space:]]+5([[:space:]]|$)' \
            android/app/build.gradle

          grep -Fq 'versionName "1.3.0"' \
            android/app/build.gradle

          echo "Android project and version verified."

      # 12. Build Debug APK
      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        shell: bash
        run: |
          set -euo pipefail

          cd android
          ./gradlew --no-daemon assembleDebug

          test -s app/build/outputs/apk/debug/app-debug.apk

      # 13. Upload Debug APK
      - name: Upload Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: KumbhConnect-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 14. Prepare release signing
      - name: Prepare release signing
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.TWA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: TWA_KEYSTORE_BASE64 secret is missing."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: TWA_KEYSTORE_PASSWORD secret is missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: TWA_KEY_ALIAS variable is missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: TWA_KEY_PASSWORD secret is missing."
            exit 1
          }

          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/android-signing/release.keystore"

          mkdir -p "$(dirname "$ANDROID_KEYSTORE_PATH")"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$ANDROID_KEYSTORE_PATH"

          test -s "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

          keytool -list \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" \
            >> "$GITHUB_ENV"

          echo "Release signing key verified."

      # 15. Build signed Release APK and AAB
      - name: Build signed Release APK and AAB
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.TWA_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -s "$ANDROID_KEYSTORE_PATH"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          cd android

          ./gradlew --no-daemon \
            assembleRelease \
            bundleRelease \
            "-Pandroid.injected.signing.store.file=$ANDROID_KEYSTORE_PATH" \
            "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"

          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      # 16. Verify release artifacts and signatures
      - name: Verify Release APK and AAB
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.TWA_KEY_ALIAS }}
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -s "$APK"
          test -s "$AAB"

          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null

          jarsigner -verify "$AAB"
          apksigner verify --verbose "$APK"

          echo "Release artifacts verified."
          ls -lh "$APK" "$AAB"

      # 17. Upload Release APK
      - name: Upload Release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: KumbhConnect-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # 18. Upload Release AAB
      - name: Upload Release AAB
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: KumbhConnect-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      # 19. Clean up temporary signing key
      - name: Clean up signing key
        if: ${{ always() && (inputs.build_type == 'release' || inputs.build_type == 'both') }}
        shell: bash
        env:
          SIGNING_DIR: ${{ runner.temp }}/android-signing
        run: |
          set -euo pipefail
          rm -rf "$SIGNING_DIR"
          echo "Temporary signing files removed."
