name: KumbhConnect Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Select Android build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: read

concurrency:
  group: kumbhconnect-android-build
  cancel-in-progress: false

jobs:
  android-build:
    name: Build KumbhConnect Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f capacitor.config.ts
          test -f scripts/android/prepare-web.mjs

          node -e '
            const p = require("./package.json");

            for (const name of [
              "@capacitor/core",
              "@capacitor/cli",
              "@capacitor/android"
            ]) {
              if (!p.dependencies?.[name] &&
                  !p.devDependencies?.[name]) {
                console.error("Missing dependency:", name);
                process.exitCode = 1;
              }
            }
          '

          echo "Required project files verified."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate package lock if missing
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi

          test -s package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Verify Android package ID
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const config = fs.readFileSync("capacitor.config.ts", "utf8");

          if (!/appId\s*:\s*['"]in\.kumbhconnect\.nashik['"]/.test(config)) {
            throw new Error("Unexpected Capacitor appId");
          }

          console.log("Capacitor appId verified.");
          NODE

          test -f android/app/build.gradle

      - name: Build debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: kumbhconnect-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Check release signing secrets
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        env:
          KS_B64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.TWA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KS_B64" || {
            echo "::error::TWA_KEYSTORE_BASE64 is missing"
            exit 1
          }

          test -n "$KS_PASSWORD" || {
            echo "::error::TWA_KEYSTORE_PASSWORD is missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "::error::TWA_KEY_ALIAS repository variable is missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "::error::TWA_KEY_PASSWORD is missing"
            exit 1
          }

      - name: Decode and validate release keystore
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        env:
          KS_B64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.TWA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077

          mkdir -p "$RUNNER_TEMP/android-signing"

          KS="$RUNNER_TEMP/android-signing/release.keystore"

          printf '%s' "$KS_B64" | base64 --decode > "$KS"

          test -s "$KS" || {
            echo "::error::Decoded keystore is empty"
            exit 1
          }

          keytool -list \
            -keystore "$KS" \
            -storepass:env KS_PASSWORD \
            -alias "$KEY_ALIAS" >/dev/null

          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

          echo "Keystore and alias validated."

      - name: Configure release signing
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        env:
          KS_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
          KEY_ALIAS: ${{ vars.TWA_KEY_ALIAS }}
        run: |
          set -euo pipefail

          FILE="android/app/build.gradle"

          test -f "$FILE" || {
            echo "::error::Generated app/build.gradle not found"
            exit 1
          }

          test -n "${ANDROID_KEYSTORE_PATH:-}" || {
            echo "::error::Keystore path is missing"
            exit 1
          }

          test -n "$KS_PASSWORD" || {
            echo "::error::Keystore password is missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "::error::Key password is missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "::error::Key alias is missing"
            exit 1
          }

          export ANDROID_KEYSTORE_PATH KS_PASSWORD KEY_PASSWORD KEY_ALIAS

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const file = "android/app/build.gradle";
          let text = fs.readFileSync(file, "utf8");

          if (!/android\s*\{/.test(text)) {
            throw new Error("Could not find android block");
          }

          if (!/buildTypes\s*\{/.test(text) ||
              !/release\s*\{/.test(text)) {
            throw new Error("Could not find release build type");
          }

          if (/signingConfigs\s*\{/.test(text)) {
            throw new Error(
              "Signing configuration already exists; refusing to patch blindly"
            );
          }

          const androidMatch = text.match(/android\s*\{/);
          const insertAt = androidMatch.index + androidMatch[0].length;

          const signingBlock = `
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("KS_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          `;

          text =
            text.slice(0, insertAt) +
            "\n" + signingBlock +
            text.slice(insertAt);

          const releasePattern =
            /(buildTypes\s*\{[\s\S]*?release\s*\{)/;

          if (!releasePattern.test(text)) {
            throw new Error("Could not patch release build type");
          }

          text = text.replace(
            releasePattern,
            match => match +
              "\n            signingConfig signingConfigs.release"
          );

          fs.writeFileSync(file, text);
          console.log("Release signing configuration written.");
          NODE

          cd android
          ./gradlew help

      - name: Build signed Release APK and AAB
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        run: |
          set -euo pipefail

          cd android
          chmod +x gradlew

          ./gradlew assembleRelease bundleRelease

      - name: Verify Release APK and AAB
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        env:
          KS_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.TWA_KEY_ALIAS }}
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          KS="$ANDROID_KEYSTORE_PATH"

          test -s "$APK" || {
            echo "::error::Release APK is missing"
            exit 1
          }

          test -s "$AAB" || {
            echo "::error::Release AAB is missing"
            exit 1
          }

          unzip -tq "$APK"
          unzip -tq "$AAB"

          jarsigner -verify "$AAB" >/dev/null || {
            echo "::error::AAB signature verification failed"
            exit 1
          }

          BT=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d |
            sort -V | tail -1)

          test -n "$BT" || {
            echo "::error::Android build-tools not found"
            exit 1
          }

          "$BT/apksigner" verify --verbose "$APK"

          KS_FP=$(
            keytool -list -v \
              -keystore "$KS" \
              -storepass:env KS_PASSWORD \
              -alias "$KEY_ALIAS" |
            grep -m1 'SHA256:' |
            sed 's/.*SHA256: *//' |
            tr -d ':[:space:]' |
            tr 'a-f' 'A-F'
          )

          APK_FP=$(
            "$BT/apksigner" verify --print-certs "$APK" |
            grep -m1 'certificate SHA-256 digest' |
            sed 's/.*: *//' |
            tr -d ':[:space:]' |
            tr 'a-f' 'A-F'
          )

          test -n "$KS_FP" && test "$KS_FP" = "$APK_FP" || {
            echo "::error::APK certificate does not match the keystore"
            exit 1
          }

          echo "APK signature matches the configured keystore."
          sha256sum "$APK" "$AAB" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release APK and AAB
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: kumbhconnect-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 3

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${RUNNER_TEMP:-}" ]; then
            rm -f "$RUNNER_TEMP/android-signing/release.keystore"
          fi
