
name: Build KumbhConnect Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Select Android build type"
        required: true
        type: choice
        options:
          - debug
          - release
          - both
        default: debug

permissions:
  contents: read

concurrency:
  group: kumbhconnect-android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build KumbhConnect v1.5.1 (SDK 36)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APP_ID: in.kumbhconnect.nashik
      APP_NAME: KumbhConnect
      APP_VERSION: "1.5.1"
      APP_VERSION_CODE: "17"

      ANDROID_COMPILE_SDK: "36"
      ANDROID_TARGET_SDK: "36"
      ANDROID_BUILD_TOOLS: "36.0.0"

    steps:
      # ------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------
      # 2. Node.js
      # ------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ------------------------------------------------
      # 3. Python
      # ------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------
      # 4. Java 21
      # ------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ------------------------------------------------
      # 5. Android SDK
      # ------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # ------------------------------------------------
      # 6. Install SDK 36
      # ------------------------------------------------
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory not found."
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          set +o pipefail
          yes | sdkmanager --licenses >/dev/null || true
          set -o pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          [ -d "$SDK/platforms/android-${ANDROID_COMPILE_SDK}" ] || {
            echo "::error::Android platform missing."
            exit 1
          }

          [ -d "$SDK/build-tools/${ANDROID_BUILD_TOOLS}" ] || {
            echo "::error::Android build tools missing."
            exit 1
          }

          echo "Android SDK installation verified."

      # ------------------------------------------------
      # 7. Verify project files and dependencies
      # ------------------------------------------------
      - name: Verify project files and dependencies
        shell: bash
        run: |
          set -euo pipefail

          need() {
            [ -s "$1" ] || {
              echo "::error::Missing or empty file: $1"
              exit 1
            }
          }

          need package.json
          need scripts/android/prepare-web.mjs
          need scripts/android/generate-icons.py

          need index.html
          need kc-native.js
          need kc-native.css
          need sw.js

          if [ ! -f capacitor.config.ts ] &&
             [ ! -f capacitor.config.json ] &&
             [ ! -f capacitor.config.js ]; then
            echo "::error::Capacitor configuration not found."
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          const p = require('./package.json');

          const has = n =>
            Boolean(
              (p.dependencies && p.dependencies[n]) ||
              (p.devDependencies && p.devDependencies[n])
            );

          const required = [
            '@capacitor/core',
            '@capacitor/cli',
            '@capacitor/android',
            '@capacitor/geolocation',
            '@capacitor/camera',
            '@capacitor/share',
            '@capacitor/app',
            '@capacitor/network',
            '@capacitor/local-notifications',
            '@capacitor/splash-screen',
            '@capacitor/filesystem',
            'leaflet'
          ];

          let failed = false;

          for (const name of required) {
            if (has(name)) {
              console.log('OK:', name);
            } else {
              console.error('::error::Missing dependency:', name);
              failed = true;
            }
          }

          if (
            fs.existsSync('capacitor.config.ts') &&
            !has('typescript')
          ) {
            console.error(
              '::error::capacitor.config.ts requires typescript.'
            );
            failed = true;
          }

          if (failed) process.exit(1);

          console.log('All required dependencies verified.');
          NODE

          [ -f icon-512.png ] || {
            echo "::error::icon-512.png missing."
            exit 1
          }

          [ -f icon-maskable-512.png ] || {
            echo "::error::icon-maskable-512.png missing."
            exit 1
          }

      # ------------------------------------------------
      # 8. Verify native plugins and local configuration
      # ------------------------------------------------
      - name: Verify native plugins and local configuration
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE'
          const p = require('./package.json');

          const has = n =>
            Boolean(
              (p.dependencies && p.dependencies[n]) ||
              (p.devDependencies && p.devDependencies[n])
            );

          const required = [
            '@capacitor/geolocation',
            '@capacitor/camera',
            '@capacitor/share',
            '@capacitor/app',
            '@capacitor/network',
            '@capacitor/local-notifications',
            '@capacitor/splash-screen',
            '@capacitor/filesystem'
          ];

          let failed = false;

          for (const name of required) {
            if (has(name)) {
              console.log('Native plugin OK:', name);
            } else {
              console.error('::error::Missing native plugin:', name);
              failed = true;
            }
          }

          const optional = [
            '@capacitor/haptics',
            '@capacitor/status-bar',
            '@capacitor/keyboard',
            '@capacitor/push-notifications'
          ];

          for (const name of optional) {
            if (!has(name)) {
              console.log('Optional plugin not installed:', name);
            }
          }

          if (failed) process.exit(1);
          NODE

          for f in capacitor.config.ts capacitor.config.js; do
            if [ -f "$f" ] &&
               grep -nE '^[[:space:]]*url[[:space:]]*:' "$f"; then
              echo "::error::Remote server.url detected in $f."
              exit 1
            fi
          done

          if [ -f capacitor.config.json ] &&
             grep -n '"url"[[:space:]]*:' capacitor.config.json; then
            echo "::error::Remote server.url detected."
            exit 1
          fi

          echo "Native plugin and local configuration checks passed."

      # ------------------------------------------------
      # 9. Ensure npm lock file
      # ------------------------------------------------
      - name: Ensure npm lock file exists
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package-lock.json ] &&
             [ ! -f npm-shrinkwrap.json ]; then
            echo "Generating npm lock file."
            npm install --package-lock-only --ignore-scripts
          fi

          if [ ! -f package-lock.json ] &&
             [ ! -f npm-shrinkwrap.json ]; then
            echo "::error::npm lock file was not generated."
            exit 1
          fi

      # ------------------------------------------------
      # 10. Install dependencies
      # ------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ------------------------------------------------
      # 11. Verify source files
      # ------------------------------------------------
      - name: Verify native source files
        shell: bash
        run: |
          set -euo pipefail

          for f in index.html kc-native.js kc-native.css sw.js; do
            [ -s "$f" ] || {
              echo "::error::Missing or empty: $f"
              exit 1
            }
          done

          node --check kc-native.js
          node --check scripts/android/prepare-web.mjs

          echo "Native source files verified."

      # ------------------------------------------------
      # 12. Prepare web assets
      # ------------------------------------------------
      - name: Prepare web assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/android/prepare-web.mjs

      # ------------------------------------------------
      # 13. Bundle Leaflet locally
      # ------------------------------------------------
      - name: Bundle Leaflet locally
        shell: bash
        run: |
          set -euo pipefail

          L=node_modules/leaflet/dist

          [ -s "$L/leaflet.js" ] || {
            echo "::error::leaflet.js missing."
            exit 1
          }

          [ -s "$L/leaflet.css" ] || {
            echo "::error::leaflet.css missing."
            exit 1
          }

          [ -d "$L/images" ] || {
            echo "::error::Leaflet images missing."
            exit 1
          }

          mkdir -p www/vendor/leaflet

          cp "$L/leaflet.js" www/vendor/leaflet/
          cp "$L/leaflet.css" www/vendor/leaflet/

          rm -rf www/vendor/leaflet/images
          cp -r "$L/images" www/vendor/leaflet/images

          python - <<'PY'
          import sys
          from pathlib import Path

          f = Path("www/index.html")
          t = f.read_text(encoding="utf-8")

          pairs = [
              (
                  "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css",
                  "vendor/leaflet/leaflet.css"
              ),
              (
                  "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js",
                  "vendor/leaflet/leaflet.js"
              )
          ]

          for old, new in pairs:
              if old not in t:
                  print("::error::Leaflet reference not found: " + old)
                  sys.exit(1)

              t = t.replace(old, new)

          f.write_text(t, encoding="utf-8")
          print("Leaflet bundled locally.")
          PY

      # ------------------------------------------------
      # 14. Verify prepared web assets
      # ------------------------------------------------
      - name: Verify prepared web assets
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            www/index.html \
            www/kc-native.js \
            www/kc-native.css \
            www/sw.js \
            www/vendor/leaflet/leaflet.js \
            www/vendor/leaflet/leaflet.css; do

            [ -s "$f" ] || {
              echo "::error::Missing or empty: $f"
              exit 1
            }
          done

          node --check www/kc-native.js

          if grep -q "unpkg.com/leaflet" www/index.html; then
            echo "::error::Leaflet still loads from unpkg."
            exit 1
          fi

          if grep -qi 'http-equiv="refresh"' www/index.html; then
            echo "::error::Meta refresh redirect detected."
            exit 1
          fi

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';

          const html = fs.readFileSync('www/index.html', 'utf8');

          for (const asset of ['kc-native.js', 'kc-native.css']) {
            if (!html.includes(asset)) {
              console.error('::error::Missing reference:', asset);
              process.exit(1);
            }
          }

          console.log('Native JS/CSS references verified.');
          NODE

      # ------------------------------------------------
      # 15. Add Android platform
      # ------------------------------------------------
      - name: Add Android platform
        shell: bash
        run: |
          set -euo pipefail

          if [ -d android ]; then
            echo "android/ already exists. Skipping cap add."
          else
            npx cap add android
          fi

      # ------------------------------------------------
      # 16. Sync Capacitor
      # ------------------------------------------------
      - name: Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync android

      # ------------------------------------------------
      # 17. Generate launcher icons and splash
      # ------------------------------------------------
      - name: Install Pillow and generate Android icons
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install \
            --disable-pip-version-check \
            "Pillow>=9.1,<13"

          python scripts/android/generate-icons.py

          R=android/app/src/main/res

          for f in \
            "$R/mipmap-xxxhdpi/ic_launcher.png" \
            "$R/mipmap-xxxhdpi/ic_launcher_round.png" \
            "$R/mipmap-xxxhdpi/ic_launcher_foreground.png" \
            "$R/mipmap-anydpi-v26/ic_launcher.xml" \
            "$R/mipmap-anydpi-v26/ic_launcher_round.xml" \
            "$R/values/ic_launcher_background.xml"; do

            [ -s "$f" ] || {
              echo "::error::Generated resource missing: $f"
              exit 1
            }
          done

          echo "Launcher icons and splash generated."

      # ------------------------------------------------
      # 18. Patch AndroidManifest
      # ------------------------------------------------
      - name: Patch AndroidManifest permissions
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")

          if not p.is_file():
              print("::error::AndroidManifest.xml not found.")
              sys.exit(1)

          t = p.read_text(encoding="utf-8")

          pkg = json.loads(
              Path("package.json").read_text(encoding="utf-8")
          )

          deps = {}
          deps.update(pkg.get("dependencies", {}))
          deps.update(pkg.get("devDependencies", {}))

          notif = any(
              n in deps for n in (
                  "@capacitor/local-notifications",
                  "@capacitor/push-notifications"
              )
          )

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("NOTIF_PLUGINS=%d\n" % (1 if notif else 0))

          if "xmlns:tools=" not in t:
              t = t.replace(
                  "<manifest ",
                  '<manifest xmlns:tools="http://schemas.android.com/tools" ',
                  1
              )

          # Remove stale notification permission removal directives
          # when notification plugins are installed.
          if notif:
              t = re.sub(
                  r'(?m)^[ \t]*<uses-permission\b'
                  r'(?=[^>]*android:name="android\.permission\.'
                  r'(?:RECEIVE_BOOT_COMPLETED|WAKE_LOCK|POST_NOTIFICATIONS)")'
                  r'(?=[^>]*tools:node="remove")[^>]*/>[ \t]*\n?',
                  '',
                  t
              )

          lines = []

          for perm in (
              "ACCESS_COARSE_LOCATION",
              "ACCESS_FINE_LOCATION"
          ):
              name = "android.permission." + perm

              if not re.search(
                  r'<uses-permission\b[^>]*android:name="' +
                  re.escape(name) + r'"',
                  t
              ):
                  lines.append(
                      '    <uses-permission android:name="%s" />' % name
                  )

          for feature in (
              "android.hardware.location.gps",
              "android.hardware.camera"
          ):
              if not re.search(
                  r'<uses-feature\b[^>]*android:name="' +
                  re.escape(feature) + r'"',
                  t
              ):
                  lines.append(
                      '    <uses-feature android:name="%s" '
                      'android:required="false" />' % feature
                  )

          if notif:
              name = "android.permission.POST_NOTIFICATIONS"

              if not re.search(
                  r'<uses-permission\b[^>]*android:name="' +
                  re.escape(name) + r'"',
                  t
              ):
                  lines.append(
                      '    <uses-permission android:name="%s" />' % name
                  )
          else:
              for perm in (
                  "RECEIVE_BOOT_COMPLETED",
                  "WAKE_LOCK",
                  "POST_NOTIFICATIONS"
              ):
                  name = "android.permission." + perm

                  if not re.search(
                      r'<uses-permission\b'
                      r'(?=[^>]*android:name="' + re.escape(name) + r'")'
                      r'(?=[^>]*tools:node="remove")',
                      t
                  ):
                      lines.append(
                          '    <uses-permission android:name="%s" '
                          'tools:node="remove" />' % name
                      )

          if lines:
              t = t.replace(
                  "</manifest>",
                  "\n".join(lines) + "\n</manifest>",
                  1
              )

          p.write_text(t, encoding="utf-8")

          print("Notification plugins installed:", notif)
          print("Manifest permissions patched.")
          PY

      # ------------------------------------------------
      # 19. Validate AndroidManifest XML
      # ------------------------------------------------
      - name: Validate AndroidManifest XML
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import xml.etree.ElementTree as ET

          ET.parse("android/app/src/main/AndroidManifest.xml")

          print("AndroidManifest.xml is valid.")
          PY

      # ------------------------------------------------
      # 20. Configure SDK and app version
      # ------------------------------------------------
      - name: Configure Android SDK and app version
        shell: bash
        env:
          VERSION_NAME: ${{ env.APP_VERSION }}
          VERSION_CODE: ${{ env.APP_VERSION_CODE }}
          COMPILE_SDK: ${{ env.ANDROID_COMPILE_SDK }}
          TARGET_SDK: ${{ env.ANDROID_TARGET_SDK }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          def fail(message):
              print("::error::" + message)
              sys.exit(1)

          version_code = int(os.environ["VERSION_CODE"])
          version_name = os.environ["VERSION_NAME"]
          compile_sdk = os.environ["COMPILE_SDK"]
          target_sdk = os.environ["TARGET_SDK"]

          if version_code < 1:
              fail("VERSION_CODE must be positive.")

          if not re.fullmatch(r"\d+\.\d+\.\d+", version_name):
              fail("Invalid semantic version name.")

          app = next(
              (
                  p for p in (
                      Path("android/app/build.gradle"),
                      Path("android/app/build.gradle.kts")
                  )
                  if p.is_file()
              ),
              None
          )

          if app is None:
              fail("Android app Gradle file not found.")

          # Update SDK values in the standard Capacitor variables file.
          variables = Path("android/variables.gradle")
          sdk_done = False

          if variables.is_file():
              t = variables.read_text(encoding="utf-8")

              t, n1 = re.subn(
                  r'(?m)^(\s*compileSdkVersion\s*=\s*)\d+',
                  lambda m: m.group(1) + compile_sdk,
                  t
              )

              t, n2 = re.subn(
                  r'(?m)^(\s*targetSdkVersion\s*=\s*)\d+',
                  lambda m: m.group(1) + target_sdk,
                  t
              )

              if n1 == 1 and n2 == 1:
                  variables.write_text(t, encoding="utf-8")
                  sdk_done = True
                  print("SDK values updated in variables.gradle.")

              elif n1 or n2:
                  fail(
                      "Only one SDK variable was found in variables.gradle. "
                      "Review its structure before building."
                  )

          # If variables.gradle does not define both values,
          # try literal SDK values in the app Gradle file.
          if not sdk_done:
              t = app.read_text(encoding="utf-8")

              t, n1 = re.subn(
                  r'(?m)^(\s*compileSdk(?:Version)?\s*=?\s*)\d+',
                  lambda m: m.group(1) + compile_sdk,
                  t
              )

              t, n2 = re.subn(
                  r'(?m)^(\s*targetSdk(?:Version)?\s*=?\s*)\d+',
                  lambda m: m.group(1) + target_sdk,
                  t
              )

              if n1 != 1 or n2 != 1:
                  fail(
                      "Could not safely configure compileSdk and targetSdk. "
                      "Check variables.gradle and app Gradle configuration."
                  )

              app.write_text(t, encoding="utf-8")
              print("SDK values updated in app Gradle file.")

          # Configure app version.
          t = app.read_text(encoding="utf-8")

          t, n1 = re.subn(
              r'(?m)^(\s*versionCode\s*(?:=\s*)?)\d+',
              lambda m: m.group(1) + str(version_code),
              t
          )

          t, n2 = re.subn(
              r'''(?m)^(\s*versionName\s*(?:=\s*)*)(["']).*?\2''',
              lambda m: m.group(1) + '"' + version_name + '"',
              t
          )

          if n1 != 1 or n2 != 1:
              fail(
                  "Could not safely update versionCode/versionName. "
                  "Check app/build.gradle."
              )

          app.write_text(t, encoding="utf-8")

          # Ensure Gradle warning suppression is present.
          gp = Path("android/gradle.properties")

          if gp.is_file():
              gtxt = gp.read_text(encoding="utf-8")
          else:
              gtxt = ""

          key = "android.suppressUnsupportedCompileSdk"

          if not re.search(
              r'(?m)^\s*' + re.escape(key) + r'\s*=',
              gtxt
          ):
              with gp.open("a", encoding="utf-8") as f:
                  f.write(
                      "\n" + key + "=" + compile_sdk + "\n"
                  )

          print(
              "Configured version: %s (%s), compileSdk=%s, targetSdk=%s"
              % (
                  version_name,
                  version_code,
                  compile_sdk,
                  target_sdk
              )
          )
          PY

      # ------------------------------------------------
      # 21. Verify Gradle and Android configuration
      # ------------------------------------------------
      - name: Verify Gradle and Android configuration
        shell: bash
        run: |
          set -euo pipefail

          [ -f android/gradlew ] || {
            echo "::error::android/gradlew missing."
            exit 1
          }

          [ -f android/gradle/wrapper/gradle-wrapper.properties ] || {
            echo "::error::Gradle wrapper properties missing."
            exit 1
          }

          chmod +x android/gradlew

          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          def version_tuple(value):
              return tuple(int(x) for x in value.split("."))

          # Gradle wrapper compatibility.
          wrapper = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          ).read_text(encoding="utf-8")

          match = re.search(
              r"gradle-(\d+\.\d+(?:\.\d+)?)-(?:bin|all)\.zip",
              wrapper
          )

          if not match:
              print("::error::Could not detect Gradle wrapper version.")
              sys.exit(1)

          gradle_version = match.group(1)

          if version_tuple(gradle_version) < (8, 11, 1):
              print(
                  "::error::Gradle %s is too old for the configured SDK 36 build."
                  % gradle_version
              )
              sys.exit(1)

          print("Gradle wrapper:", gradle_version)

          # Inspect common AGP declarations.
          candidates = [
              Path("android/build.gradle"),
              Path("android/build.gradle.kts"),
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts"),
              Path("android/gradle/libs.versions.toml")
          ]

          agp_versions = []

          patterns = [
              r"com\.android\.tools\.build:gradle:(\d+\.\d+(?:\.\d+)?)",
              r"""id\s*\(?\s*["']com\.android\.application["']\s*\)?\s*version\s*["'](\d+\.\d+(?:\.\d+)?)["']""",
              r"""agp\s*=\s*["'](\d+\.\d+(?:\.\d+)?)["']""",
              r"""com\.android\.application\s*=\s*["'](\d+\.\d+(?:\.\d+)?)["']"""
          ]

          for path in candidates:
              if not path.is_file():
                  continue

              content = path.read_text(encoding="utf-8")

              for pattern in patterns:
                  agp_versions.extend(
                      re.findall(pattern, content)
                  )

          if agp_versions:
              detected = max(
                  agp_versions,
                  key=version_tuple
              )

              print("Detected Android Gradle Plugin:", detected)

              if version_tuple(detected) < (8, 9, 1):
                  print(
                      "::error::AGP %s is below the minimum expected "
                      "for API 36. Review the Android Gradle Plugin version."
                      % detected
                  )
                  sys.exit(1)
          else:
              print(
                  "::warning::AGP version was not detected in common "
                  "Gradle files. Verify plugin aliases/version catalogs."
              )

          # Verify SDK declarations after configuration.
          variables = Path("android/variables.gradle")
          app = Path("android/app/build.gradle")
          app_kts = Path("android/app/build.gradle.kts")

          sdk_files = [
              p for p in (variables, app, app_kts)
              if p.is_file()
          ]

          combined = "\n".join(
              p.read_text(encoding="utf-8")
              for p in sdk_files
          )

          if not re.search(
              r"compileSdkVersion\s*=\s*36|compileSdk(?:Version)?\s*=?\s*36",
              combined
          ):
              print("::error::compileSdk 36 declaration not verified.")
              sys.exit(1)

          if not re.search(
              r"targetSdkVersion\s*=\s*36|targetSdk(?:Version)?\s*=?\s*36",
              combined
          ):
              print("::error::targetSdk 36 declaration not verified.")
              sys.exit(1)

          print("Gradle and SDK configuration checks passed.")
          PY

          cd android
          ./gradlew --no-daemon --version

      # ------------------------------------------------
      # 22. Build Debug APK
      # ------------------------------------------------
      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        shell: bash
        run: |
          set -euo pipefail

          cd android

          ./gradlew \
            --no-daemon \
            --console=plain \
            --stacktrace \
            assembleDebug

          [ -s app/build/outputs/apk/debug/app-debug.apk ] || {
            echo "::error::Debug APK not produced."
            exit 1
          }

      # ------------------------------------------------
      # 23. Verify Debug APK
      # ------------------------------------------------
      - name: Verify Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT2="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/aapt2"

          [ -x "$AAPT2" ] || {
            echo "::error::aapt2 not found."
            exit 1
          }

          B="$("$AAPT2" dump badging "$APK")"

          grep -q "name='${APP_ID}'" <<< "$B" || {
            echo "::error::Debug APK package ID mismatch."
            exit 1
          }

          grep -q "versionCode='${APP_VERSION_CODE}'" <<< "$B" || {
            echo "::error::Debug versionCode mismatch."
            exit 1
          }

          grep -q "versionName='${APP_VERSION}'" <<< "$B" || {
            echo "::error::Debug versionName mismatch."
            exit 1
          }

          grep -q "targetSdkVersion:'${ANDROID_TARGET_SDK}'" <<< "$B" || {
            echo "::error::Debug target SDK mismatch."
            exit 1
          }

          grep -q "android.permission.ACCESS_FINE_LOCATION" <<< "$B" || {
            echo "::error::Debug ACCESS_FINE_LOCATION missing."
            exit 1
          }

          grep -q "android.permission.ACCESS_COARSE_LOCATION" <<< "$B" || {
            echo "::error::Debug ACCESS_COARSE_LOCATION missing."
            exit 1
          }

          if [ "${NOTIF_PLUGINS:-0}" = "1" ]; then
            grep -q "android.permission.POST_NOTIFICATIONS" <<< "$B" || {
              echo "::error::Debug POST_NOTIFICATIONS missing."
              exit 1
            }
          fi

          echo "Debug APK verification passed."

      # ------------------------------------------------
      # 24. Upload Debug APK
      # ------------------------------------------------
      - name: Upload Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: KumbhConnect-v1.5.1-17-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------
      # 25. Decode release keystore
      # ------------------------------------------------
      - name: Decode release keystore
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.TWA_KEY_ALIAS || secrets.TWA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          [ -n "$KEYSTORE_BASE64" ] || {
            echo "::error::TWA_KEYSTORE_BASE64 missing."
            exit 1
          }

          [ -n "$KEYSTORE_PASSWORD" ] || {
            echo "::error::TWA_KEYSTORE_PASSWORD missing."
            exit 1
          }

          [ -n "$KEY_ALIAS" ] || {
            echo "::error::TWA_KEY_ALIAS missing."
            exit 1
          }

          [ -n "$KEY_PASSWORD" ] || {
            echo "::error::TWA_KEY_PASSWORD missing."
            exit 1
          }

          KEYSTORE_PATH="$RUNNER_TEMP/kumbhconnect-release.keystore"

          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > "$KEYSTORE_PATH"

          [ -s "$KEYSTORE_PATH" ] || {
            echo "::error::Decoded keystore is empty."
            exit 1
          }

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEY_ALIAS" >/dev/null

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Existing release keystore validated."

      # ------------------------------------------------
      # 26. Build Release APK and AAB
      # ------------------------------------------------
      - name: Build release APK and AAB
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        run: |
          set -euo pipefail

          cd android

          ./gradlew \
            --no-daemon \
            --console=plain \
            --stacktrace \
            assembleRelease \
            bundleRelease

          [ -s app/build/outputs/bundle/release/app-release.aab ] || {
            echo "::error::Release AAB not produced."
            exit 1
          }

      # ------------------------------------------------
      # 27. Align and sign release artifacts
      # ------------------------------------------------
      - name: Sign release APK and AAB
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.TWA_KEY_ALIAS || secrets.TWA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS"

          [ -x "$BT/apksigner" ] || {
            echo "::error::apksigner not found."
            exit 1
          }

          [ -x "$BT/zipalign" ] || {
            echo "::error::zipalign not found."
            exit 1
          }

          [ -s "$ANDROID_KEYSTORE_PATH" ] || {
            echo "::error::Release keystore missing."
            exit 1
          }

          APK_DIR="android/app/build/outputs/apk/release"
          AAB_IN="android/app/build/outputs/bundle/release/app-release.aab"

          APK_IN="$APK_DIR/app-release-unsigned.apk"

          if [ ! -s "$APK_IN" ]; then
            APK_IN="$APK_DIR/app-release.apk"
          fi

          [ -s "$APK_IN" ] || {
            echo "::error::Release APK not found."
            ls -la "$APK_DIR" || true
            exit 1
          }

          [ -s "$AAB_IN" ] || {
            echo "::error::Release AAB not found."
            exit 1
          }

          BASE="KumbhConnect-${APP_VERSION}-${APP_VERSION_CODE}"

          mkdir -p dist

          "$BT/zipalign" -p -f 4 \
            "$APK_IN" \
            "$RUNNER_TEMP/aligned.apk"

          "$BT/apksigner" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "dist/${BASE}-release.apk" \
            "$RUNNER_TEMP/aligned.apk"

          cp "$AAB_IN" "dist/${BASE}-release.aab"

          jarsigner \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "dist/${BASE}-release.aab" \
            "$KEY_ALIAS"

          echo "Release artifacts signed."

      # ------------------------------------------------
      # 28. Verify Release APK, AAB and certificates
      # ------------------------------------------------
      - name: Verify release artifacts and signatures
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.TWA_KEY_ALIAS || secrets.TWA_KEY_ALIAS }}
        run: |
          set -euo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS"

          APK="$(find dist -maxdepth 1 -name '*-release.apk' -print -quit)"
          AAB="$(find dist -maxdepth 1 -name '*-release.aab' -print -quit)"

          [ -s "$APK" ] || {
            echo "::error::Signed APK missing."
            exit 1
          }

          [ -s "$AAB" ] || {
            echo "::error::Signed AAB missing."
            exit 1
          }

          unzip -tq "$APK"
          unzip -tq "$AAB"

          # APK metadata.
          B="$("$BT/aapt2" dump badging "$APK")"

          grep -q "name='${APP_ID}'" <<< "$B" || {
            echo "::error::Release package ID mismatch."
            exit 1
          }

          grep -q "versionCode='${APP_VERSION_CODE}'" <<< "$B" || {
            echo "::error::Release versionCode mismatch."
            exit 1
          }

          grep -q "versionName='${APP_VERSION}'" <<< "$B" || {
            echo "::error::Release versionName mismatch."
            exit 1
          }

          grep -q "targetSdkVersion:'${ANDROID_TARGET_SDK}'" <<< "$B" || {
            echo "::error::Release target SDK mismatch."
            exit 1
          }

          # Release permissions.
          grep -q "android.permission.ACCESS_FINE_LOCATION" <<< "$B" || {
            echo "::error::Release ACCESS_FINE_LOCATION missing."
            exit 1
          }

          grep -q "android.permission.ACCESS_COARSE_LOCATION" <<< "$B" || {
            echo "::error::Release ACCESS_COARSE_LOCATION missing."
            exit 1
          }

          if [ "${NOTIF_PLUGINS:-0}" = "1" ]; then
            grep -q "android.permission.POST_NOTIFICATIONS" <<< "$B" || {
              echo "::error::Release POST_NOTIFICATIONS missing."
              exit 1
            }
          fi

          # Verify APK signature.
          APK_SIGN_OUTPUT="$(
            "$BT/apksigner" verify --verbose --print-certs "$APK"
          )"

          printf '%s\n' "$APK_SIGN_OUTPUT"

          # Verify AAB signature.
          jarsigner -verify -verbose:summary "$AAB"

          AAB_CERT_OUTPUT="$(keytool -printcert -jarfile "$AAB")"

          # Compare APK/AAB signer certificates with the existing keystore.
          KEY_CERT="$(
            keytool -list -v \
              -keystore "$ANDROID_KEYSTORE_PATH" \
              -storepass:env KEYSTORE_PASSWORD \
              -alias "$KEY_ALIAS" |
            awk -F': ' '/SHA256:/ {
              gsub(/:/, "", $2);
              print tolower($2);
              exit
            }'
          )"

          APK_CERT="$(
            printf '%s\n' "$APK_SIGN_OUTPUT" |
            awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {
              gsub(/:/, "", $2);
              print tolower($2);
              exit
            }'
          )"

          AAB_CERT="$(
            printf '%s\n' "$AAB_CERT_OUTPUT" |
            awk -F': ' '/SHA256:/ {
              gsub(/:/, "", $2);
              print tolower($2);
              exit
            }'
          )"

          [ -n "$KEY_CERT" ] || {
            echo "::error::Could not read keystore certificate fingerprint."
            exit 1
          }

          [ -n "$APK_CERT" ] || {
            echo "::error::Could not read APK certificate fingerprint."
            exit 1
          }

          [ -n "$AAB_CERT" ] || {
            echo "::error::Could not read AAB certificate fingerprint."
            exit 1
          }

          if [ "$APK_CERT" != "$KEY_CERT" ]; then
            echo "::error::APK certificate does not match configured keystore."
            exit 1
          fi

          if [ "$AAB_CERT" != "$KEY_CERT" ]; then
            echo "::error::AAB certificate does not match configured keystore."
            exit 1
          fi

          echo "APK and AAB signing certificate matches the configured keystore."

          echo "=== Signing certificate SHA-256 ==="
          echo "$KEY_CERT"

          for f in "$APK" "$AAB"; do
            echo "=== $f ==="
            ls -lh "$f"
            sha256sum "$f"
          done

          echo "Release artifact verification completed."

      # ------------------------------------------------
      # 29. Upload signed release files
      # ------------------------------------------------
      - name: Upload signed Release APK and AAB
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: KumbhConnect-v1.5.1-17-Release-APK-AAB
          path: |
            dist/*-release.apk
            dist/*-release.aab
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------
      # 30. Cleanup temporary keystore
      # ------------------------------------------------
      - name: Cleanup signing keystore
        if: ${{ always() && (inputs.build_type == 'release' || inputs.build_type == 'both') }}
        shell: bash
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ] &&
             [ -f "$ANDROID_KEYSTORE_PATH" ]; then
            rm -f "$ANDROID_KEYSTORE_PATH"
            echo "Temporary keystore removed."
          fi
