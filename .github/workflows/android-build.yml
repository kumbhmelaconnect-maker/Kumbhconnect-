
name: Build KumbhConnect Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Select Android build type"
        required: true
        type: choice
        options:
          - debug
          - release
          - both
        default: debug

permissions:
  contents: read

concurrency:
  group: kumbhconnect-android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build KumbhConnect v1.5.1 (SDK 36) for PhonePe Appstore
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APP_ID: in.kumbhconnect.nashik
      APP_NAME: KumbhConnect
      APP_VERSION: "1.5.1"
      APP_VERSION_CODE: "17"

      ANDROID_COMPILE_SDK: "36"
      ANDROID_TARGET_SDK: "36"
      ANDROID_BUILD_TOOLS: "36.0.0"

    steps:
      # ------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------
      # 2. Node.js
      # ------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ------------------------------------------------
      # 3. Java 21
      # ------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ------------------------------------------------
      # 4. Android SDK
      # ------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # ------------------------------------------------
      # 5. Install SDK 36
      # ------------------------------------------------
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -eu

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory was not found."
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          set +o pipefail
          yes | sdkmanager --licenses > /dev/null || true
          set -o pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          [ -d "$SDK/platforms/android-${ANDROID_COMPILE_SDK}" ] || {
            echo "::error::Android platform missing."
            exit 1
          }

          [ -d "$SDK/build-tools/${ANDROID_BUILD_TOOLS}" ] || {
            echo "::error::Android build tools missing."
            exit 1
          }

          echo "Android SDK setup completed."

      # ------------------------------------------------
      # 6. Verify project files and dependencies
      # ------------------------------------------------
      - name: Verify project files and dependencies
        shell: bash
        run: |
          set -euo pipefail

          need() {
            [ -s "$1" ] || {
              echo "::error::Missing or empty file: $1"
              exit 1
            }
          }

          need package.json
          need scripts/android/prepare-web.mjs
          need scripts/android/generate-icons.py

          need index.html
          need kc-native.js
          need kc-native.css
          need sw.js

          if [ ! -f capacitor.config.ts ] &&
             [ ! -f capacitor.config.json ] &&
             [ ! -f capacitor.config.js ]; then
            echo "::error::Capacitor configuration not found."
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          const p = require('./package.json');

          const has = n =>
            Boolean(
              (p.dependencies && p.dependencies[n]) ||
              (p.devDependencies && p.devDependencies[n])
            );

          const required = [
            '@capacitor/core',
            '@capacitor/cli',
            '@capacitor/android',
            '@capacitor/geolocation',
            '@capacitor/camera',
            '@capacitor/share',
            '@capacitor/app',
            '@capacitor/network',
            '@capacitor/local-notifications',
            '@capacitor/splash-screen',
            '@capacitor/filesystem',
            'leaflet'
          ];

          let failed = false;

          for (const n of required) {
            if (has(n)) {
              console.log('OK:', n);
            } else {
              console.error('::error::Missing dependency: ' + n);
              failed = true;
            }
          }

          if (
            fs.existsSync('capacitor.config.ts') &&
            !has('typescript')
          ) {
            console.error(
              '::error::capacitor.config.ts requires typescript.'
            );
            failed = true;
          }

          if (failed) process.exit(1);

          console.log('All required dependencies verified.');
          NODE

      # ------------------------------------------------
      # 7. Native plugin and local website guard
      # ------------------------------------------------
      - name: Verify native plugins and local website configuration
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE'
          const p = require('./package.json');

          const has = n =>
            Boolean(
              (p.dependencies && p.dependencies[n]) ||
              (p.devDependencies && p.devDependencies[n])
            );

          const required = [
            '@capacitor/geolocation',
            '@capacitor/camera',
            '@capacitor/share',
            '@capacitor/app',
            '@capacitor/network',
            '@capacitor/local-notifications',
            '@capacitor/splash-screen',
            '@capacitor/filesystem'
          ];

          let failed = false;

          for (const n of required) {
            if (has(n)) {
              console.log('Native plugin OK:', n);
            } else {
              console.error('::error::Missing native plugin: ' + n);
              failed = true;
            }
          }

          const optional = [
            '@capacitor/haptics',
            '@capacitor/status-bar',
            '@capacitor/keyboard',
            '@capacitor/push-notifications'
          ];

          for (const n of optional) {
            if (!has(n)) {
              console.log('Optional plugin not installed:', n);
            }
          }

          if (failed) process.exit(1);
          NODE

          for f in capacitor.config.ts capacitor.config.js; do
            if [ -f "$f" ] && grep -nE '^[[:space:]]*url[[:space:]]*:' "$f"; then
              echo "::error::Remote server.url detected in $f."
              exit 1
            fi
          done

          if [ -f capacitor.config.json ] &&
             grep -n '"url"[[:space:]]*:' capacitor.config.json; then
            echo "::error::Remote server.url detected."
            exit 1
          fi

          echo "Native plugin and local asset checks passed."

      # ------------------------------------------------
      # 8. Ensure npm lock file
      # ------------------------------------------------
      - name: Ensure npm lock file exists
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package-lock.json ] &&
             [ ! -f npm-shrinkwrap.json ]; then
            echo "Generating npm lock file."
            npm install --package-lock-only --ignore-scripts
          fi

          if [ ! -f package-lock.json ] &&
             [ ! -f npm-shrinkwrap.json ]; then
            echo "::error::npm lock file was not generated."
            exit 1
          fi

      # ------------------------------------------------
      # 9. Install dependencies
      # ------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ------------------------------------------------
      # 10. Verify native source files
      # ------------------------------------------------
      - name: Verify native source files
        shell: bash
        run: |
          set -euo pipefail

          for f in index.html kc-native.js kc-native.css sw.js; do
            [ -s "$f" ] || {
              echo "::error::Missing or empty: $f"
              exit 1
            }
          done

          node --check kc-native.js
          node --check scripts/android/prepare-web.mjs

          echo "Native source files verified."

      # ------------------------------------------------
      # 11. Prepare web assets
      # ------------------------------------------------
      - name: Prepare web assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/android/prepare-web.mjs

      # ------------------------------------------------
      # 12. Bundle Leaflet locally
      # ------------------------------------------------
      - name: Bundle Leaflet locally
        shell: bash
        run: |
          set -euo pipefail

          L=node_modules/leaflet/dist

          [ -s "$L/leaflet.js" ] || {
            echo "::error::leaflet.js missing."
            exit 1
          }

          [ -s "$L/leaflet.css" ] || {
            echo "::error::leaflet.css missing."
            exit 1
          }

          [ -d "$L/images" ] || {
            echo "::error::Leaflet images missing."
            exit 1
          }

          mkdir -p www/vendor/leaflet

          cp "$L/leaflet.js" "$L/leaflet.css" www/vendor/leaflet/
          cp -r "$L/images" www/vendor/leaflet/images

          python3 - <<'PY'
          import sys
          from pathlib import Path

          f = Path("www/index.html")
          t = f.read_text(encoding="utf-8")

          pairs = [
              (
                  "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css",
                  "vendor/leaflet/leaflet.css"
              ),
              (
                  "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js",
                  "vendor/leaflet/leaflet.js"
              )
          ]

          for old, new in pairs:
              if old not in t:
                  print("::error::Not found: " + old)
                  sys.exit(1)

              t = t.replace(old, new)

          f.write_text(t, encoding="utf-8")
          print("Leaflet bundled locally.")
          PY

          if grep -rl "unpkg.com" www \
            --include='*.html' --include='*.js' >/tmp/unpkg.txt 2>/dev/null; then
            if [ -s /tmp/unpkg.txt ]; then
              echo "::warning::Other unpkg.com references remain:"
              cat /tmp/unpkg.txt
            fi
          fi

      # ------------------------------------------------
      # 13. Verify prepared web assets
      # ------------------------------------------------
      - name: Verify prepared web assets
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            www/index.html \
            www/kc-native.js \
            www/kc-native.css \
            www/sw.js \
            www/vendor/leaflet/leaflet.js \
            www/vendor/leaflet/leaflet.css; do

            [ -s "$f" ] || {
              echo "::error::Missing or empty: $f"
              exit 1
            }
          done

          node --check www/kc-native.js

          if grep -q "unpkg.com/leaflet" www/index.html; then
            echo "::error::Leaflet still loads from unpkg."
            exit 1
          fi

          if grep -qi 'http-equiv="refresh"' www/index.html; then
            echo "::error::Meta refresh redirect detected."
            exit 1
          fi

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';

          const html = fs.readFileSync('www/index.html', 'utf8');

          let failed = false;

          for (const asset of ['kc-native.js', 'kc-native.css']) {
            if (!html.includes(asset)) {
              console.error('::error::Missing reference: ' + asset);
              failed = true;
            }
          }

          if (failed) process.exit(1);

          console.log('Native JS/CSS references verified.');
          NODE

      # ------------------------------------------------
      # 14. Add Android platform
      # ------------------------------------------------
      - name: Add Android platform
        shell: bash
        run: |
          set -euo pipefail

          if [ -d android ]; then
            echo "android/ already exists. Skipping cap add."
          else
            npx cap add android
          fi

      # ------------------------------------------------
      # 15. Sync Capacitor
      # ------------------------------------------------
      - name: Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync android

      # ------------------------------------------------
      # 16. Install KumbhConnect launcher icon and splash
      # ------------------------------------------------
      - name: Install KumbhConnect launcher icon and splash
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --quiet pillow

          python3 scripts/android/generate-icons.py

          R=android/app/src/main/res

          for f in \
            "$R/mipmap-xxxhdpi/ic_launcher.png" \
            "$R/mipmap-xxxhdpi/ic_launcher_foreground.png" \
            "$R/mipmap-anydpi-v26/ic_launcher.xml"; do

            [ -s "$f" ] || {
              echo "::error::Icon file missing: $f"
              exit 1
            }
          done

          echo "Launcher icon installed."

      # ------------------------------------------------
      # 17. Patch AndroidManifest permissions
      # ------------------------------------------------
      - name: Patch AndroidManifest permissions
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")

          if not p.is_file():
              print("::error::AndroidManifest.xml not found")
              sys.exit(1)

          t = p.read_text(encoding="utf-8")

          pkg = json.loads(Path("package.json").read_text(encoding="utf-8"))

          deps = {}
          deps.update(pkg.get("dependencies", {}))
          deps.update(pkg.get("devDependencies", {}))

          notif = any(
              n in deps for n in (
                  "@capacitor/local-notifications",
                  "@capacitor/push-notifications"
              )
          )

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("NOTIF_PLUGINS=%d\n" % (1 if notif else 0))

          if "xmlns:tools" not in t:
              t = t.replace(
                  "<manifest ",
                  '<manifest xmlns:tools="http://schemas.android.com/tools" ',
                  1
              )

          notif_perms = (
              "RECEIVE_BOOT_COMPLETED",
              "WAKE_LOCK",
              "POST_NOTIFICATIONS"
          )

          if notif:
              t = re.sub(
                  r'\s*<uses-permission android:name="android\.permission\.(?:RECEIVE_BOOT_COMPLETED|WAKE_LOCK|POST_NOTIFICATIONS)" tools:node="remove" />',
                  '',
                  t
              )

          lines = []

          for perm in (
              "ACCESS_COARSE_LOCATION",
              "ACCESS_FINE_LOCATION"
          ):
              name = "android.permission." + perm

              if 'android:name="%s"' % name not in t:
                  lines.append(
                      '    <uses-permission android:name="%s" />' % name
                  )

          for feat in (
              "android.hardware.location.gps",
              "android.hardware.camera"
          ):
              if 'android:name="%s"' % feat not in t:
                  lines.append(
                      '    <uses-feature android:name="%s" android:required="false" />' % feat
                  )

          if notif:
              name = "android.permission.POST_NOTIFICATIONS"

              if 'android:name="%s"' % name not in t:
                  lines.append(
                      '    <uses-permission android:name="%s" />' % name
                  )
          else:
              for perm in notif_perms:
                  name = "android.permission." + perm

                  if ('android:name="%s" tools:node="remove"' % name) not in t:
                      lines.append(
                          '    <uses-permission android:name="%s" tools:node="remove" />' % name
                      )

          if lines:
              t = t.replace(
                  "</manifest>",
                  "\n".join(lines) + "\n</manifest>",
                  1
              )

          p.write_text(t, encoding="utf-8")

          print("Notification plugins installed:", notif)
          print("Manifest permissions patched.")
          PY

      # ------------------------------------------------
      # 18. Configure SDK 36 and version 1.5.1
      # ------------------------------------------------
      - name: Configure Android SDK and version
        shell: bash
        env:
          VERSION_NAME: ${{ env.APP_VERSION }}
          VERSION_CODE: ${{ env.APP_VERSION_CODE }}
          COMPILE_SDK: ${{ env.ANDROID_COMPILE_SDK }}
          TARGET_SDK: ${{ env.ANDROID_TARGET_SDK }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          def fail(msg):
              print("::error::" + msg)
              sys.exit(1)

          version_code = int(os.environ["VERSION_CODE"])
          version_name = os.environ["VERSION_NAME"]
          compile_sdk = os.environ["COMPILE_SDK"]
          target_sdk = os.environ["TARGET_SDK"]

          if version_code < 1:
              fail("VERSION_CODE must be positive.")

          app = next(
              (
                  p for p in (
                      Path("android/app/build.gradle"),
                      Path("android/app/build.gradle.kts")
                  )
                  if p.is_file()
              ),
              None
          )

          if app is None:
              fail("Android app Gradle file not found.")

          vf = Path("android/variables.gradle")
          done = False

          if vf.is_file():
              t = vf.read_text()

              t, n1 = re.subn(
                  r'(compileSdkVersion\s*=\s*)\d+',
                  r'\g<1>' + compile_sdk,
                  t
              )

              t, n2 = re.subn(
                  r'(targetSdkVersion\s*=\s*)\d+',
                  r'\g<1>' + target_sdk,
                  t
              )

              if n1 and n2:
                  vf.write_text(t)
                  done = True
                  print("SDK levels configured in variables.gradle")

          text = app.read_text()

          if not done:
              text, n1 = re.subn(
                  r'(compileSdk(?:Version)?\s*=?\s*)\d+',
                  r'\g<1>' + compile_sdk,
                  text
              )

              text, n2 = re.subn(
                  r'(targetSdk(?:Version)?\s*=?\s*)\d+',
                  r'\g<1>' + target_sdk,
                  text
              )

              if not (n1 and n2):
                  fail("Could not configure SDK levels.")

          text, n1 = re.subn(
              r'(versionCode\s*=?\s*)\d+',
              r'\g<1>' + str(version_code),
              text
          )

          text, n2 = re.subn(
              r'''(versionName\s*=?\s*)(["']).*?\2''',
              r'\g<1>"' + version_name + '"',
              text
          )

          if not (n1 and n2):
              fail("Could not configure versionCode/versionName.")

          app.write_text(text)

          gp = Path("android/gradle.properties")

          if gp.is_file():
              gtxt = gp.read_text()
          else:
              gtxt = ""

          if "android.suppressUnsupportedCompileSdk" not in gtxt:
              with gp.open("a") as f:
                  f.write(
                      "\nandroid.suppressUnsupportedCompileSdk="
                      + compile_sdk + "\n"
                  )

          root = Path("android/build.gradle")

          if root.is_file():
              m = re.search(
                  r'com\.android\.tools\.build:gradle:(\d+)\.(\d+)',
                  root.read_text()
              )

              if m:
                  ver = (int(m.group(1)), int(m.group(2)))
                  print("AGP detected:", ver)

                  if ver < (8, 9):
                      print(
                          "::warning::AGP is older than 8.9. "
                          "Check SDK 36 compatibility."
                      )

          print(
              "compileSdk=%s targetSdk=%s versionCode=%d versionName=%s"
              % (
                  compile_sdk,
                  target_sdk,
                  version_code,
                  version_name
              )
          )
          PY

      # ------------------------------------------------
      # 19. Verify Android project and application identity
      # ------------------------------------------------
      - name: Verify Android project, SDK and application identity
        shell: bash
        run: |
          set -euo pipefail

          [ -f android/gradlew ] || {
            echo "::error::android/gradlew missing"
            exit 1
          }

          chmod +x android/gradlew

          APP_GRADLE=""

          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              APP_GRADLE="$f"
              break
            fi
          done

          [ -n "$APP_GRADLE" ] || {
            echo "::error::Android app Gradle file missing."
            exit 1
          }

          grep -qE "applicationId[[:space:]]*(=|[[:space:]])[\"']${APP_ID}[\"']" "$APP_GRADLE" || {
            echo "::error::applicationId mismatch"
            exit 1
          }

          grep -qE "versionCode[[:space:]]*(=|[[:space:]])${APP_VERSION_CODE}" "$APP_GRADLE" || {
            echo "::error::versionCode mismatch"
            exit 1
          }

          grep -qE "versionName[[:space:]]*(=|[[:space:]])[\"']${APP_VERSION}[\"']" "$APP_GRADLE" || {
            echo "::error::versionName mismatch"
            exit 1
          }

          grep -qE '(compileSdk(Version)?[[:space:]]*=?[[:space:]]*36)' \
            android/variables.gradle "$APP_GRADLE" 2>/dev/null || {
            echo "::error::compileSdk 36 not verified"
            exit 1
          }

          grep -qE '(targetSdk(Version)?[[:space:]]*=?[[:space:]]*36)' \
            android/variables.gradle "$APP_GRADLE" 2>/dev/null || {
            echo "::error::targetSdk 36 not verified"
            exit 1
          }

          echo "Android project configuration verified."

      # ------------------------------------------------
      # 20. Build Debug APK
      # ------------------------------------------------
      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        shell: bash
        run: |
          set -euo pipefail

          cd android

          ./gradlew --no-daemon --console=plain --stacktrace assembleDebug

          [ -s app/build/outputs/apk/debug/app-debug.apk ] || {
            echo "::error::Debug APK not produced"
            exit 1
          }

      # ------------------------------------------------
      # 21. Verify Debug APK
      # ------------------------------------------------
      - name: Verify Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT2="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/aapt2"

          [ -x "$AAPT2" ] || {
            echo "::error::aapt2 not found"
            exit 1
          }

          B="$("$AAPT2" dump badging "$APK")"

          grep -q "name='${APP_ID}'" <<< "$B" || {
            echo "::error::APK package ID mismatch"
            exit 1
          }

          grep -q "versionCode='${APP_VERSION_CODE}'" <<< "$B" || {
            echo "::error::Debug versionCode mismatch"
            exit 1
          }

          grep -q "versionName='${APP_VERSION}'" <<< "$B" || {
            echo "::error::Debug versionName mismatch"
            exit 1
          }

          grep -q "targetSdkVersion:'${ANDROID_TARGET_SDK}'" <<< "$B" || {
            echo "::error::Debug target SDK mismatch"
            exit 1
          }

          grep -q "android.permission.ACCESS_FINE_LOCATION" <<< "$B" || {
            echo "::error::ACCESS_FINE_LOCATION missing"
            exit 1
          }

          grep -q "android.permission.ACCESS_COARSE_LOCATION" <<< "$B" || {
            echo "::error::ACCESS_COARSE_LOCATION missing"
            exit 1
          }

          if [ "${NOTIF_PLUGINS:-0}" = "1" ]; then
            grep -q "android.permission.POST_NOTIFICATIONS" <<< "$B" || {
              echo "::error::POST_NOTIFICATIONS missing"
              exit 1
            }
          fi

          echo "Debug APK checks passed."

      # ------------------------------------------------
      # 22. Upload Debug APK
      # ------------------------------------------------
      - name: Upload Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: KumbhConnect-v1.5.1-17-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------
      # 23. Decode release keystore
      # ------------------------------------------------
      - name: Decode release keystore
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.TWA_KEY_ALIAS || secrets.TWA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          [ -n "$KEYSTORE_BASE64" ] || {
            echo "::error::TWA_KEYSTORE_BASE64 missing"
            exit 1
          }

          [ -n "$KEYSTORE_PASSWORD" ] || {
            echo "::error::TWA_KEYSTORE_PASSWORD missing"
            exit 1
          }

          [ -n "$KEY_ALIAS" ] || {
            echo "::error::TWA_KEY_ALIAS missing"
            exit 1
          }

          [ -n "$KEY_PASSWORD" ] || {
            echo "::error::TWA_KEY_PASSWORD missing"
            exit 1
          }

          KEYSTORE_PATH="$RUNNER_TEMP/kumbhconnect-release.keystore"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          [ -s "$KEYSTORE_PATH" ] || {
            echo "::error::Decoded keystore is empty"
            exit 1
          }

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEY_ALIAS" > /dev/null || {
              echo "::error::Keystore password or alias validation failed."
              exit 1
            }

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Release keystore validated."

      # ------------------------------------------------
      # 24. Build unsigned Release APK and AAB
      # ------------------------------------------------
      - name: Build release APK and AAB
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        run: |
          set -euo pipefail

          cd android

          ./gradlew --no-daemon --console=plain --stacktrace \
            assembleRelease bundleRelease

      # ------------------------------------------------
      # 25. Align and sign release artifacts
      # ------------------------------------------------
      - name: Sign release APK and AAB
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.TWA_KEY_ALIAS || secrets.TWA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS"

          [ -x "$BT/apksigner" ] || {
            echo "::error::apksigner not found"
            exit 1
          }

          [ -x "$BT/zipalign" ] || {
            echo "::error::zipalign not found"
            exit 1
          }

          [ -s "$ANDROID_KEYSTORE_PATH" ] || {
            echo "::error::Keystore missing"
            exit 1
          }

          APK_DIR="android/app/build/outputs/apk/release"
          AAB_IN="android/app/build/outputs/bundle/release/app-release.aab"

          APK_IN="$APK_DIR/app-release-unsigned.apk"

          if [ ! -s "$APK_IN" ]; then
            APK_IN="$APK_DIR/app-release.apk"
          fi

          [ -s "$APK_IN" ] || {
            echo "::error::Release APK not found"
            ls -la "$APK_DIR" || true
            exit 1
          }

          [ -s "$AAB_IN" ] || {
            echo "::error::Release AAB not found"
            exit 1
          }

          BASE="KumbhConnect-${APP_VERSION}-${APP_VERSION_CODE}"

          mkdir -p dist

          "$BT/zipalign" -p -f 4 "$APK_IN" "$RUNNER_TEMP/aligned.apk"

          "$BT/apksigner" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "dist/${BASE}-release.apk" \
            "$RUNNER_TEMP/aligned.apk"

          cp "$AAB_IN" "dist/${BASE}-release.aab"

          jarsigner \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "dist/${BASE}-release.aab" \
            "$KEY_ALIAS"

          ls -lh dist

      # ------------------------------------------------
      # 26. Verify release artifacts and signatures
      # ------------------------------------------------
      - name: Verify release artifacts
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.TWA_KEY_ALIAS || secrets.TWA_KEY_ALIAS }}
        run: |
          set -euo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS"

          APK="$(find dist -maxdepth 1 -name '*-release.apk' -print -quit)"
          AAB="$(find dist -maxdepth 1 -name '*-release.aab' -print -quit)"

          [ -s "$APK" ] || {
            echo "::error::Signed APK missing"
            exit 1
          }

          [ -s "$AAB" ] || {
            echo "::error::Signed AAB missing"
            exit 1
          }

          unzip -tq "$APK"
          unzip -tq "$AAB"

          B="$("$BT/aapt2" dump badging "$APK")"

          grep -q "name='${APP_ID}'" <<< "$B" || {
            echo "::error::Release package ID mismatch"
            exit 1
          }

          grep -q "versionCode='${APP_VERSION_CODE}'" <<< "$B" || {
            echo "::error::Release versionCode mismatch"
            exit 1
          }

          grep -q "versionName='${APP_VERSION}'" <<< "$B" || {
            echo "::error::Release versionName mismatch"
            exit 1
          }

          grep -q "targetSdkVersion:'${ANDROID_TARGET_SDK}'" <<< "$B" || {
            echo "::error::Release target SDK mismatch"
            exit 1
          }

          "$BT/apksigner" verify --verbose --print-certs "$APK"

          jarsigner -verify -verbose:summary "$AAB"

          echo "=== Release signing certificate SHA-256 ==="

          keytool -list -v \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEY_ALIAS" | grep -E 'SHA256:' || true

          for f in "$APK" "$AAB"; do
            echo "=== $f ==="
            ls -lh "$f"
            sha256sum "$f"
          done

          echo "Release artifact verification completed."

      # ------------------------------------------------
      # 27. Upload signed release files
      # ------------------------------------------------
      - name: Upload signed Release APK and AAB
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: KumbhConnect-v1.5.1-17-Release-APK-AAB
          path: |
            dist/*-release.apk
            dist/*-release.aab
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------
      # 28. Cleanup signing keystore
      # ------------------------------------------------
      - name: Cleanup signing keystore
        if: ${{ always() && (inputs.build_type == 'release' || inputs.build_type == 'both') }}
        shell: bash
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ] &&
             [ -f "$ANDROID_KEYSTORE_PATH" ]; then
            rm -f "$ANDROID_KEYSTORE_PATH"
            echo "Temporary keystore removed."
          fi
